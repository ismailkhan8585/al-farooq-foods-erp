<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="catBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12" />
      <stop offset="40%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <radialGradient id="catGlow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="crispGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="catShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#catBg4)" />
  <circle cx="200" cy="130" r="130" fill="url(#catGlow4)" />
  <ellipse cx="200" cy="245" rx="100" ry="14" fill="#000000" opacity="0.35" filter="url(#catShadow4)" />

  <!-- Burst of Golden Curved Potato Crisps Artwork -->
  <g filter="url(#catShadow4)">
    <!-- Central Crisp -->
    <g transform="translate(160, 95) rotate(15)">
      <path d="M 0 35 Q 35 -15 75 10 Q 90 45 55 60 Q 15 60 0 35 Z" fill="url(#crispGrad)" stroke="#b45309" stroke-width="1" />
      <path d="M 12 34 Q 40 5 68 25" fill="none" stroke="#d97706" stroke-width="1.8" />
      <path d="M 22 45 Q 46 20 62 38" fill="none" stroke="#d97706" stroke-width="1.8" />
    </g>

    <!-- Side Crisp 1 -->
    <g transform="translate(100, 130) rotate(-35)">
      <path d="M 0 25 Q 25 -10 55 5 Q 65 35 40 45 Q 10 45 0 25 Z" fill="url(#crispGrad)" stroke="#b45309" stroke-width="1" />
    </g>

    <!-- Side Crisp 2 -->
    <g transform="translate(250, 110) rotate(30)">
      <path d="M 0 25 Q 25 -10 55 5 Q 65 35 40 45 Q 10 45 0 25 Z" fill="url(#crispGrad)" stroke="#b45309" stroke-width="1" />
    </g>

    <!-- Salt and Spices Particles -->
    <circle cx="140" cy="90" r="2.5" fill="#ffffff" />
    <circle cx="160" cy="70" r="2" fill="#ef4444" />
    <circle cx="240" cy="75" r="2.5" fill="#ffffff" />
    <circle cx="265" cy="85" r="2" fill="#ef4444" />
    <circle cx="130" cy="180" r="2.5" fill="#facc15" />
    <circle cx="270" cy="170" r="2" fill="#ffffff" />
  </g>

  <!-- Title Pill -->
  <g transform="translate(16, 240)">
    <rect x="0" y="0" width="168" height="42" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#facc15" stroke-width="1.2" />
    <text x="14" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">POTATO CHIPS</text>
    <text x="14" y="32" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#facc15">Salted &amp; Spicy Crinkle Crisps</text>
  </g>
</svg>
