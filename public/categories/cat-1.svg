<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="catBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="catGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="catShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#catBg1)" />
  <circle cx="200" cy="130" r="130" fill="url(#catGlow1)" />
  <ellipse cx="200" cy="245" rx="100" ry="14" fill="#000000" opacity="0.35" filter="url(#catShadow1)" />

  <!-- Mountain Spring Water Splash & Pure Drops Artwork -->
  <g filter="url(#catShadow1)">
    <!-- Mountain Peak Silhouette in Background -->
    <polygon points="120,180 200,80 280,180" fill="#0369a1" opacity="0.4" />
    <polygon points="170,180 230,105 290,180" fill="#075985" opacity="0.3" />
    <polygon points="185,100 200,80 215,100 205,105 200,98 195,105" fill="#e0f2fe" opacity="0.9" />

    <!-- Pure Water Drop Crown Splash -->
    <path d="M 200 65 Q 212 90 225 120 Q 235 150 200 170 Q 165 150 175 120 Q 188 90 200 65 Z" fill="#bae6fd" opacity="0.9" />
    <path d="M 200 78 Q 208 98 218 122 Q 225 145 200 160 Q 175 145 182 122 Q 192 98 200 78 Z" fill="#ffffff" opacity="0.95" />

    <!-- Water Ripples -->
    <ellipse cx="200" cy="190" rx="75" ry="14" fill="none" stroke="#7dd3fc" stroke-width="2.5" opacity="0.8" />
    <ellipse cx="200" cy="198" rx="110" ry="20" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.6" />
    <ellipse cx="200" cy="208" rx="140" ry="24" fill="none" stroke="#0284c7" stroke-width="1.2" opacity="0.4" />

    <!-- Flying Water Droplets -->
    <circle cx="150" cy="100" r="5" fill="#e0f2fe" />
    <circle cx="250" cy="95" r="4.5" fill="#e0f2fe" />
    <circle cx="130" cy="130" r="3.5" fill="#38bdf8" />
    <circle cx="270" cy="125" r="4" fill="#38bdf8" />
  </g>

  <!-- Title Pill -->
  <g transform="translate(16, 240)">
    <rect x="0" y="0" width="168" height="42" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <text x="14" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">MINERAL WATER</text>
    <text x="14" y="32" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#38bdf8">Bottles, Gallons &amp; Dispensers</text>
  </g>
</svg>
