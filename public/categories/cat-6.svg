<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="catBg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="catGlow6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <filter id="catShadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#catBg6)" />
  <circle cx="200" cy="130" r="130" fill="url(#catGlow6)" />
  <ellipse cx="200" cy="245" rx="100" ry="14" fill="#000000" opacity="0.35" filter="url(#catShadow6)" />

  <!-- Sparkling Soda, Fizz & Ice Cubes Artwork -->
  <g filter="url(#catShadow6)">
    <!-- Soda Can / Glass Contour -->
    <rect x="175" y="75" width="50" height="110" rx="12" fill="#06b6d4" fill-opacity="0.85" stroke="#ffffff" stroke-width="1.5" />
    <!-- Liquid Gradient inside -->
    <rect x="178" y="95" width="44" height="86" rx="8" fill="#3b82f6" />

    <!-- Ice Cubes Floating -->
    <rect x="184" y="105" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.7" stroke="#bae6fd" stroke-width="1" />
    <rect x="202" y="125" width="15" height="15" rx="3" fill="#ffffff" fill-opacity="0.7" stroke="#bae6fd" stroke-width="1" />

    <!-- Effervescent Carbonation Bubbles -->
    <circle cx="190" cy="145" r="3" fill="#e0f2fe" opacity="0.9" />
    <circle cx="210" cy="155" r="2.5" fill="#e0f2fe" opacity="0.9" />
    <circle cx="195" cy="165" r="3.5" fill="#e0f2fe" opacity="0.9" />
    <circle cx="205" cy="115" r="2" fill="#e0f2fe" opacity="0.9" />
    <circle cx="188" cy="130" r="2.2" fill="#e0f2fe" opacity="0.9" />

    <!-- Sparkling Bubbles Bursting Above -->
    <circle cx="160" cy="65" r="4" fill="#67e8f9" />
    <circle cx="175" cy="50" r="3" fill="#a5f3fc" />
    <circle cx="215" cy="45" r="4.5" fill="#67e8f9" />
    <circle cx="235" cy="60" r="3.5" fill="#a5f3fc" />
    <circle cx="245" cy="80" r="2.5" fill="#ffffff" />
    <circle cx="150" cy="85" r="3" fill="#ffffff" />

    <!-- Citrus Slice Accent -->
    <g transform="translate(145, 95) rotate(-30)">
      <circle cx="16" cy="16" r="16" fill="#84cc16" />
      <circle cx="16" cy="16" r="13" fill="#fef08a" />
      <circle cx="16" cy="16" r="11" fill="#65a30d" />
    </g>
  </g>

  <!-- Title Pill -->
  <g transform="translate(16, 240)">
    <rect x="0" y="0" width="180" height="42" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <text x="14" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">CARBONATED DRINKS</text>
    <text x="14" y="32" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#38bdf8">Sparkling Sodas &amp; Beverages</text>
  </g>
</svg>
