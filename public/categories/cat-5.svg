<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="catBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="catGlow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>
    <filter id="catShadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#catBg5)" />
  <circle cx="200" cy="130" r="130" fill="url(#catGlow5)" />
  <ellipse cx="200" cy="245" rx="100" ry="14" fill="#000000" opacity="0.35" filter="url(#catShadow5)" />

  <!-- Savory Snacks, Nimko & Extruded Puffs Artwork -->
  <g filter="url(#catShadow5)">
    <!-- Wooden Snack Bowl Silhouette -->
    <ellipse cx="200" cy="170" rx="70" ry="24" fill="#451a03" />
    <path d="M 130 170 Q 200 220 270 170 Z" fill="#78350f" />

    <!-- Crunchy Puffs & Nimko treats inside and tumbling -->
    <ellipse cx="170" cy="155" rx="14" ry="10" fill="#facc15" />
    <ellipse cx="200" cy="150" rx="16" ry="11" fill="#f59e0b" />
    <ellipse cx="230" cy="158" rx="15" ry="10" fill="#facc15" />

    <!-- Golden Corn Puffs Tumbling -->
    <circle cx="150" cy="115" r="9" fill="#facc15" />
    <circle cx="190" cy="95" r="11" fill="#fde047" />
    <circle cx="230" cy="105" r="10" fill="#fbbf24" />
    <circle cx="260" cy="130" r="8.5" fill="#facc15" />

    <!-- Savory Peanut / Cashew Bits -->
    <ellipse cx="170" cy="125" rx="6" ry="4" fill="#d97706" />
    <ellipse cx="215" cy="120" rx="7" ry="4.5" fill="#b45309" />
  </g>

  <!-- Title Pill -->
  <g transform="translate(16, 240)">
    <rect x="0" y="0" width="168" height="42" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#34d399" stroke-width="1.2" />
    <text x="14" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">SNACKS &amp; SAVORIES</text>
    <text x="14" y="32" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#34d399">Nimko, Corn Puffs &amp; Bites</text>
  </g>
</svg>
