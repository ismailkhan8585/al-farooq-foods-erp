<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="catBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <radialGradient id="catGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
    <filter id="catShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#catBg2)" />
  <circle cx="200" cy="130" r="130" fill="url(#catGlow2)" />
  <ellipse cx="200" cy="245" rx="100" ry="14" fill="#000000" opacity="0.35" filter="url(#catShadow2)" />

  <!-- Tropical Fruit Assortment Artwork -->
  <g filter="url(#catShadow2)">
    <!-- Mango in Center -->
    <path d="M 170 120 Q 195 70 235 85 Q 255 110 235 150 Q 195 165 170 120 Z" fill="#facc15" />
    <path d="M 170 120 Q 195 70 235 85" fill="none" stroke="#65a30d" stroke-width="3" />

    <!-- Red Apple on Left -->
    <circle cx="150" cy="140" r="28" fill="#dc2626" />
    <path d="M 150 112 Q 155 102 162 100" fill="none" stroke="#78350f" stroke-width="2.5" />
    <path d="M 155 105 Q 166 100 166 110 Z" fill="#22c55e" />

    <!-- Sliced Orange / Citrus Wheel on Right -->
    <g transform="translate(235, 125)">
      <circle cx="25" cy="25" r="28" fill="#f97316" />
      <circle cx="25" cy="25" r="24" fill="#ffedd5" />
      <circle cx="25" cy="25" r="21" fill="#ea580c" />
      <!-- Segments -->
      <line x1="25" y1="5" x2="25" y2="45" stroke="#ffedd5" stroke-width="1.8" />
      <line x1="5" y1="25" x2="45" y2="25" stroke="#ffedd5" stroke-width="1.8" />
      <line x1="11" y1="11" x2="39" y2="39" stroke="#ffedd5" stroke-width="1.8" />
      <line x1="11" y1="39" x2="39" y2="11" stroke="#ffedd5" stroke-width="1.8" />
    </g>

    <!-- Splashes of Golden Nectar -->
    <path d="M 130 180 Q 200 150 270 180 Q 200 200 130 180 Z" fill="#fbbf24" opacity="0.85" />
    <circle cx="120" cy="115" r="4" fill="#fde047" />
    <circle cx="275" cy="100" r="4.5" fill="#f97316" />
    <circle cx="200" cy="65" r="3.5" fill="#facc15" />
  </g>

  <!-- Title Pill -->
  <g transform="translate(16, 240)">
    <rect x="0" y="0" width="168" height="42" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" />
    <text x="14" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">FRUIT JUICE</text>
    <text x="14" y="32" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#f59e0b">Mango, Apple, Guava &amp; Orange</text>
  </g>
</svg>
