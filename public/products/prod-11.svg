<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <radialGradient id="glow11" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0" />
    </radialGradient>

    <!-- Fiery Red-Orange Metallic Pouch Gradient -->
    <linearGradient id="masalaPouch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="25%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#fdba74" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <!-- Crinkle Wavy Chip Spiced Texture -->
    <linearGradient id="crinkleChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <filter id="shadow11" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad11)" />
  <circle cx="200" cy="140" r="140" fill="url(#glow11)" />
  <ellipse cx="200" cy="264" rx="115" ry="16" fill="#000000" opacity="0.45" filter="url(#shadow11)" />

  <!-- SPICY CRINKLE CHIPS FLYING WITH CHILI ACCENTS -->
  <!-- Crinkle Chip 1 on Left -->
  <g transform="translate(95, 190) rotate(-20)">
    <path d="M 0 16 Q 15 -6 45 4 Q 55 24 35 34 Q 10 34 0 16 Z" fill="url(#crinkleChip)" stroke="#c2410c" stroke-width="0.8" />
    <!-- Crinkle Grooves -->
    <path d="M 6 14 Q 20 2 40 10" fill="none" stroke="#7c2d12" stroke-width="1.8" />
    <path d="M 10 22 Q 24 10 42 18" fill="none" stroke="#7c2d12" stroke-width="1.8" />
    <path d="M 14 30 Q 28 18 42 26" fill="none" stroke="#7c2d12" stroke-width="1.8" />
  </g>

  <!-- Crinkle Chip 2 on Right -->
  <g transform="translate(265, 200) rotate(25)">
    <path d="M 0 16 Q 15 -6 45 4 Q 55 24 35 34 Q 10 34 0 16 Z" fill="url(#crinkleChip)" stroke="#c2410c" stroke-width="0.8" />
    <path d="M 6 14 Q 20 2 40 10" fill="none" stroke="#7c2d12" stroke-width="1.8" />
    <path d="M 10 22 Q 24 10 42 18" fill="none" stroke="#7c2d12" stroke-width="1.8" />
  </g>

  <!-- Red Chili & Spices specks -->
  <circle cx="130" cy="175" r="2.2" fill="#ef4444" />
  <circle cx="145" cy="210" r="1.5" fill="#f97316" />
  <circle cx="265" cy="175" r="2" fill="#ef4444" />
  <circle cx="278" cy="190" r="1.5" fill="#facc15" />

  <!-- 40G SPICY CHATPATA CRINKLE POUCH -->
  <g filter="url(#shadow11)">
    <path d="M 165 60 
             Q 200 56 235 60 
             Q 248 145 242 235 
             Q 200 242 158 235 
             Q 152 145 165 60 Z" 
          fill="url(#masalaPouch)" />

    <!-- Top Crimped Seal -->
    <rect x="160" y="54" width="80" height="10" rx="2" fill="#7c2d12" />
    <line x1="162" y1="56" x2="162" y2="62" stroke="#fdba74" stroke-width="1" />
    <line x1="166" y1="56" x2="166" y2="62" stroke="#fdba74" stroke-width="1" />
    <line x1="170" y1="56" x2="170" y2="62" stroke="#fdba74" stroke-width="1" />
    <line x1="200" y1="56" x2="200" y2="62" stroke="#fdba74" stroke-width="1" />
    <line x1="230" y1="56" x2="230" y2="62" stroke="#fdba74" stroke-width="1" />
    <line x1="234" y1="56" x2="234" y2="62" stroke="#fdba74" stroke-width="1" />
    <line x1="238" y1="56" x2="238" y2="62" stroke="#fdba74" stroke-width="1" />

    <!-- Bottom Crimped Seal -->
    <rect x="156" y="234" width="88" height="10" rx="2" fill="#7c2d12" />

    <!-- Metallic Sheen -->
    <path d="M 195 64 Q 190 145 194 232 L 202 232 Q 200 145 203 64 Z" fill="#ffffff" opacity="0.6" />

    <!-- Front Graphic Plate -->
    <rect x="162" y="80" width="76" height="24" rx="4" fill="#18181b" />
    <text x="200" y="94" font-family="Arial, sans-serif" font-size="6.5" font-weight="900" fill="#f97316" text-anchor="middle" letter-spacing="0.5">FAROOQ CHIPS</text>
    <text x="200" y="101" font-family="Arial, sans-serif" font-size="4" font-weight="700" fill="#fed7aa" text-anchor="middle">CRINKLE CUT CRISPS</text>

    <!-- Chili / Flame Emblem -->
    <circle cx="200" cy="142" r="24" fill="#7c2d12" />
    <circle cx="200" cy="142" r="22" fill="#dc2626" />
    <!-- Chili Pepper Silhouette -->
    <path d="M 194 130 Q 202 122 210 134 Q 212 152 196 156 Q 190 146 194 130 Z" fill="#facc15" />

    <!-- Flavor Name -->
    <rect x="164" y="174" width="72" height="18" rx="3" fill="#450a0a" />
    <text x="200" y="186" font-family="Arial, sans-serif" font-size="6.5" font-weight="900" fill="#fbbf24" text-anchor="middle">SPICY CHATPATA</text>

    <!-- Weight & Pack Badge -->
    <rect x="175" y="198" width="50" height="9" rx="2" fill="#ea580c" />
    <text x="200" y="204.5" font-family="Arial, sans-serif" font-size="4.5" font-weight="900" fill="#ffffff" text-anchor="middle">40G NET WEIGHT</text>
    <text x="200" y="218" font-family="Arial, sans-serif" font-size="3.5" font-weight="800" fill="#ffffff" text-anchor="middle">WAVY CRINKLE CUT</text>
  </g>

  <!-- Packaging Badge Top Left -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="112" height="26" rx="13" fill="#0a0f1d" fill-opacity="0.85" stroke="#f97316" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#ea580c" />
    <text x="26" y="17" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">30-PACK CARTON</text>
  </g>

  <!-- Watermark -->
  <g transform="translate(16, 252)">
    <rect x="0" y="0" width="170" height="28" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="10" y="13" font-family="Arial, sans-serif" font-size="8.5" font-weight="900" fill="#f97316">AL-FAROOQ FOODS</text>
    <text x="10" y="23" font-family="Arial, sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8">Masala Crinkle Chips 40g</text>
  </g>
</svg>
