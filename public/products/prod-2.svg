<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032541" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#034975" />
    </linearGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bottleGlass2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#7dd3fc" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="labelGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#024975" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="waterLiquid2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="capGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#034975" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#022f4c" />
    </linearGradient>

    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad2)" />
  <circle cx="200" cy="140" r="140" fill="url(#glow2)" />
  <ellipse cx="200" cy="264" rx="100" ry="16" fill="#000000" opacity="0.45" filter="url(#shadow2)" />
  <ellipse cx="200" cy="262" rx="75" ry="10" fill="#38bdf8" opacity="0.25" />

  <!-- Pair Background Bottles (12-pack look) -->
  <g opacity="0.4" transform="translate(-40, -10) scale(0.92)">
    <path d="M 188 45 Q 188 75 174 100 L 174 246 Q 174 256 186 256 L 214 256 Q 226 256 226 246 L 226 100 Q 212 75 212 45 Z" fill="url(#waterLiquid2)" />
    <rect x="189" y="32" width="22" height="15" rx="3" fill="url(#capGrad2)" />
  </g>
  <g opacity="0.4" transform="translate(90, -10) scale(0.92)">
    <path d="M 188 45 Q 188 75 174 100 L 174 246 Q 174 256 186 256 L 214 256 Q 226 256 226 246 L 226 100 Q 212 75 212 45 Z" fill="url(#waterLiquid2)" />
    <rect x="189" y="32" width="22" height="15" rx="3" fill="url(#capGrad2)" />
  </g>

  <!-- MAIN 1.5L BOTTLE (Tall, Sleek Ergonomic Contour) -->
  <g filter="url(#shadow2)">
    <!-- Liquid Shape -->
    <path d="M 190 52 
             Q 190 75 178 95 
             Q 172 130 178 160 
             Q 172 195 174 248 
             Q 174 258 186 258 
             L 214 258 
             Q 226 258 226 248 
             Q 228 195 222 160 
             Q 228 130 222 95 
             Q 210 75 210 52 Z" 
          fill="url(#waterLiquid2)" />

    <!-- Glass Surface Highlight -->
    <path d="M 190 52 
             Q 190 75 178 95 
             Q 172 130 178 160 
             Q 172 195 174 248 
             Q 174 258 186 258 
             L 214 258 
             Q 226 258 226 248 
             Q 228 195 222 160 
             Q 228 130 222 95 
             Q 210 75 210 52 Z" 
          fill="url(#bottleGlass2)" />

    <!-- Vertical Sheen -->
    <path d="M 182 100 Q 178 160 180 248 L 176 248 Q 174 160 178 100 Z" fill="#ffffff" opacity="0.75" />

    <!-- Label -->
    <rect x="173" y="140" width="54" height="60" rx="4" fill="url(#labelGrad2)" />
    <text x="200" y="157" font-family="Arial, sans-serif" font-size="5.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">AL-FAROOQ</text>
    <text x="200" y="167" font-family="Arial, sans-serif" font-size="4" font-weight="700" fill="#bae6fd" text-anchor="middle">PURE MINERAL WATER</text>
    <rect x="183" y="172" width="34" height="9" rx="2" fill="#024975" />
    <text x="200" y="178" font-family="Arial, sans-serif" font-size="4" font-weight="800" fill="#38bdf8" text-anchor="middle">1.5 LITER LARGE</text>
    <text x="200" y="188" font-family="Arial, sans-serif" font-size="3" fill="#ffffff" opacity="0.85" text-anchor="middle">BALANCED TDS 120-150</text>
    <text x="200" y="195" font-family="Arial, sans-serif" font-size="2.8" fill="#e0f2fe" opacity="0.8" text-anchor="middle">PREMIUM HYDRATION</text>

    <!-- Neck & Cap -->
    <rect x="189" y="48" width="22" height="4" rx="2" fill="#e0f2fe" opacity="0.9" />
    <rect x="190" y="32" width="20" height="18" rx="3" fill="url(#capGrad2)" />
    <line x1="194" y1="34" x2="194" y2="48" stroke="#022f4c" stroke-width="1" />
    <line x1="197" y1="34" x2="197" y2="48" stroke="#022f4c" stroke-width="1" />
    <line x1="200" y1="34" x2="200" y2="48" stroke="#bae6fd" stroke-width="1" />
    <line x1="203" y1="34" x2="203" y2="48" stroke="#022f4c" stroke-width="1" />
    <line x1="206" y1="34" x2="206" y2="48" stroke="#022f4c" stroke-width="1" />
  </g>

  <!-- Droplets -->
  <circle cx="162" cy="120" r="2" fill="#e0f2fe" opacity="0.8" />
  <circle cx="238" cy="180" r="2.5" fill="#e0f2fe" opacity="0.8" />
  <circle cx="242" cy="128" r="1.5" fill="#e0f2fe" opacity="0.7" />

  <!-- Packaging Badge -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="102" height="26" rx="13" fill="#0a0f1d" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#0ea5e9" />
    <text x="26" y="17" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">12-PACK CARTON</text>
  </g>

  <!-- Watermark -->
  <g transform="translate(16, 252)">
    <rect x="0" y="0" width="138" height="28" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="10" y="13" font-family="Arial, sans-serif" font-size="8.5" font-weight="900" fill="#38bdf8">AL-FAROOQ FOODS</text>
    <text x="10" y="23" font-family="Arial, sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8">Pure Mineral Water 1.5L</text>
  </g>
</svg>
