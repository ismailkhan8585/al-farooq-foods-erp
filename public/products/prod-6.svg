<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <radialGradient id="glow6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="appleCarton" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="25%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad6)" />
  <circle cx="200" cy="140" r="140" fill="url(#glow6)" />
  <ellipse cx="200" cy="260" rx="110" ry="16" fill="#000000" opacity="0.45" filter="url(#shadow6)" />

  <!-- Fresh Red Apple & Slice on Left -->
  <g transform="translate(115, 190)">
    <!-- Whole Apple -->
    <ellipse cx="25" cy="25" rx="24" ry="22" fill="#b91c1c" />
    <ellipse cx="25" cy="25" rx="20" ry="18" fill="#dc2626" />
    <!-- Apple Top dimple & stem -->
    <path d="M 25 6 Q 28 -2 34 -4" fill="none" stroke="#78350f" stroke-width="2.5" />
    <path d="M 28 0 Q 38 -5 38 4 Q 30 6 28 0 Z" fill="#22c55e" />

    <!-- Sliced Apple Wedge -->
    <g transform="translate(-18, 12) rotate(20)">
      <path d="M 0 20 Q 15 -5 35 0 Q 38 15 25 30 Q 10 32 0 20 Z" fill="#fef08a" />
      <!-- Red Skin -->
      <path d="M 0 20 Q 15 -5 35 0" fill="none" stroke="#ef4444" stroke-width="3" />
      <!-- Tiny Apple Seeds -->
      <ellipse cx="18" cy="15" rx="2" ry="1.2" fill="#78350f" />
    </g>
  </g>

  <!-- 250ML SLIM APPLE JUICE CARTON -->
  <g filter="url(#shadow6)">
    <!-- Main Carton Box -->
    <rect x="172" y="70" width="56" height="175" rx="5" fill="url(#appleCarton)" />

    <!-- Carton Top Gable -->
    <path d="M 172 70 L 180 54 L 220 54 L 228 70 Z" fill="#dc2626" />
    <rect x="194" y="44" width="12" height="12" rx="3" fill="#ffffff" />
    <circle cx="200" cy="50" r="3.5" fill="#16a34a" />

    <!-- Vertical Sheen -->
    <path d="M 176 72 L 176 240 Q 176 243 174 243 L 173 243 Q 173 240 173 72 Z" fill="#ffffff" opacity="0.6" />

    <!-- Front Label Artwork -->
    <rect x="174" y="90" width="52" height="135" rx="3" fill="#ffffff" fill-opacity="0.12" />

    <!-- Brand Header -->
    <rect x="176" y="94" width="48" height="18" rx="3" fill="#450a0a" />
    <text x="200" y="104" font-family="Arial, sans-serif" font-size="5" font-weight="900" fill="#fca5a5" text-anchor="middle" letter-spacing="0.5">AL-FAROOQ</text>
    <text x="200" y="110" font-family="Arial, sans-serif" font-size="3.5" font-weight="700" fill="#ffffff" text-anchor="middle">PURE APPLE JUICE</text>

    <!-- Apple Graphic in Badge -->
    <circle cx="200" cy="146" r="16" fill="#b91c1c" />
    <circle cx="200" cy="146" r="13" fill="#ef4444" />
    <path d="M 200 134 Q 204 128 208 126" fill="none" stroke="#78350f" stroke-width="1.5" />
    <path d="M 204 130 Q 210 126 210 133 Z" fill="#4ade80" />

    <text x="200" y="178" font-family="Arial, sans-serif" font-size="5.5" font-weight="900" fill="#ffffff" text-anchor="middle">KASHMIRI</text>
    <text x="200" y="186" font-family="Arial, sans-serif" font-size="4.5" font-weight="800" fill="#fca5a5" text-anchor="middle">RED APPLE</text>

    <rect x="182" y="193" width="36" height="8" rx="2" fill="#16a34a" />
    <text x="200" y="199" font-family="Arial, sans-serif" font-size="4" font-weight="800" fill="#ffffff" text-anchor="middle">250 ML PACK</text>
    <text x="200" y="210" font-family="Arial, sans-serif" font-size="3" fill="#ffffff" opacity="0.85" font-weight="700" text-anchor="middle">CRISP &amp; REFRESHING</text>
  </g>

  <!-- Droplets -->
  <circle cx="244" cy="125" r="2.5" fill="#fca5a5" opacity="0.8" />
  <circle cx="250" cy="145" r="2" fill="#ef4444" opacity="0.8" />
  <circle cx="238" cy="165" r="3" fill="#f87171" opacity="0.9" />

  <!-- Packaging Badge Top Left -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="112" height="26" rx="13" fill="#0a0f1d" fill-opacity="0.85" stroke="#ef4444" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#dc2626" />
    <text x="26" y="17" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">24-PACK CARTON</text>
  </g>

  <!-- Bottom Watermark -->
  <g transform="translate(16, 252)">
    <rect x="0" y="0" width="154" height="28" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="10" y="13" font-family="Arial, sans-serif" font-size="8.5" font-weight="900" fill="#f87171">AL-FAROOQ FOODS</text>
    <text x="10" y="23" font-family="Arial, sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8">Red Apple Juice 250ml</text>
  </g>
</svg>
