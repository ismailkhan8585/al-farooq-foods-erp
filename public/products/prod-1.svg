<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Water Glow Radial -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Bottle Body Glass Gradient -->
    <linearGradient id="bottleGlass1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.7" />
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#7dd3fc" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Bottle Label Gradient -->
    <linearGradient id="labelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Water Liquid Fill Gradient -->
    <linearGradient id="waterLiquid1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.75" />
    </linearGradient>

    <!-- Plastic Cap Gradient -->
    <linearGradient id="capGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glowFilter1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" fill="url(#bgGrad1)" />

  <!-- Subtle Wave Grid Background Overlay -->
  <circle cx="200" cy="150" r="140" fill="url(#glow1)" />
  <circle cx="90" cy="220" r="50" fill="#38bdf8" opacity="0.12" />
  <circle cx="310" cy="80" r="70" fill="#38bdf8" opacity="0.1" />

  <!-- Reflection Podium Base -->
  <ellipse cx="200" cy="256" rx="110" ry="18" fill="#000000" opacity="0.45" filter="url(#shadow1)" />
  <ellipse cx="200" cy="254" rx="80" ry="12" fill="#38bdf8" opacity="0.25" />

  <!-- BACKGROUND SECONDARY BOTTLES (Pack Effect) -->
  <g opacity="0.55" transform="translate(-45, -12) scale(0.92)">
    <!-- Back Left Bottle -->
    <path d="M 175 90 Q 185 90 190 110 L 190 220 Q 190 230 180 230 L 160 230 Q 150 230 150 220 L 150 110 Q 155 90 165 90 Z" fill="url(#waterLiquid1)" />
    <rect x="162" y="76" width="16" height="15" rx="3" fill="url(#capGrad1)" />
  </g>

  <g opacity="0.55" transform="translate(95, -12) scale(0.92)">
    <!-- Back Right Bottle -->
    <path d="M 175 90 Q 185 90 190 110 L 190 220 Q 190 230 180 230 L 160 230 Q 150 230 150 220 L 150 110 Q 155 90 165 90 Z" fill="url(#waterLiquid1)" />
    <rect x="162" y="76" width="16" height="15" rx="3" fill="url(#capGrad1)" />
  </g>

  <!-- MAIN FRONT 500ML BOTTLE -->
  <g filter="url(#shadow1)">
    <!-- Liquid Body -->
    <path d="M 188 78 
             Q 188 100 174 122 
             L 174 235 
             Q 174 246 186 246 
             L 214 246 
             Q 226 246 226 235 
             L 226 122 
             Q 212 100 212 78 Z" 
          fill="url(#waterLiquid1)" />

    <!-- Glass Highlights / Sheen -->
    <path d="M 188 78 
             Q 188 100 174 122 
             L 174 235 
             Q 174 246 186 246 
             L 214 246 
             Q 226 246 226 235 
             L 226 122 
             Q 212 100 212 78 Z" 
          fill="url(#bottleGlass1)" />

    <!-- Left High-Gloss Vertical Glare -->
    <path d="M 180 126 L 180 230 Q 180 236 177 236 L 176 236 Q 175 230 176 126 Z" fill="#ffffff" opacity="0.75" />

    <!-- Bottle Label Wrapped -->
    <rect x="174" y="145" width="52" height="52" rx="4" fill="url(#labelGrad1)" />
    <!-- Label Detail -->
    <rect x="176" y="147" width="48" height="48" rx="3" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.6" />
    <text x="200" y="161" font-family="Arial, sans-serif" font-size="5.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">AL-FAROOQ</text>
    <text x="200" y="171" font-family="Arial, sans-serif" font-size="4" font-weight="700" fill="#bae6fd" text-anchor="middle">MINERAL WATER</text>
    <rect x="184" y="176" width="32" height="8" rx="2" fill="#0369a1" />
    <text x="200" y="182" font-family="Arial, sans-serif" font-size="4" font-weight="800" fill="#34d399" text-anchor="middle">500 ML PURE</text>
    <text x="200" y="191" font-family="Arial, sans-serif" font-size="3" fill="#ffffff" opacity="0.8" text-anchor="middle">BALANCED TDS</text>

    <!-- Neck Ring -->
    <rect x="187" y="74" width="26" height="4" rx="2" fill="#e0f2fe" opacity="0.9" />

    <!-- Blue Screw Cap with Grooves -->
    <rect x="189" y="58" width="22" height="17" rx="3" fill="url(#capGrad1)" />
    <!-- Cap Ridges -->
    <line x1="193" y1="60" x2="193" y2="73" stroke="#075985" stroke-width="1" />
    <line x1="197" y1="60" x2="197" y2="73" stroke="#075985" stroke-width="1" />
    <line x1="200" y1="60" x2="200" y2="73" stroke="#bae6fd" stroke-width="1" />
    <line x1="203" y1="60" x2="203" y2="73" stroke="#075985" stroke-width="1" />
    <line x1="207" y1="60" x2="207" y2="73" stroke="#075985" stroke-width="1" />
    <!-- Cap Top highlight -->
    <rect x="190" y="58" width="20" height="2" rx="1" fill="#bae6fd" opacity="0.8" />
  </g>

  <!-- Water Splash / Droplet Details -->
  <circle cx="160" cy="180" r="2.5" fill="#e0f2fe" opacity="0.8" />
  <circle cx="156" cy="186" r="1.5" fill="#e0f2fe" opacity="0.7" />
  <circle cx="242" cy="170" r="2" fill="#e0f2fe" opacity="0.8" />
  <circle cx="246" cy="195" r="2.5" fill="#e0f2fe" opacity="0.8" />

  <!-- Packaging Badge Top Left -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="102" height="26" rx="13" fill="#0a0f1d" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#38bdf8" />
    <text x="26" y="17" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">24-PACK CARTON</text>
  </g>

  <!-- Bottom Brand Watermark Banner -->
  <g transform="translate(16, 252)">
    <rect x="0" y="0" width="138" height="28" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="10" y="13" font-family="Arial, sans-serif" font-size="8.5" font-weight="900" fill="#38bdf8">AL-FAROOQ FOODS</text>
    <text x="10" y="23" font-family="Arial, sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8">Pure Mineral Water 500ml</text>
  </g>
</svg>
