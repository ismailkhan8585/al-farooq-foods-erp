<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>

    <radialGradient id="glow7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#db2777" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="guavaCarton" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d174d" />
      <stop offset="25%" stop-color="#db2777" />
      <stop offset="60%" stop-color="#f472b6" />
      <stop offset="85%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>

    <filter id="shadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad7)" />
  <circle cx="200" cy="140" r="140" fill="url(#glow7)" />
  <ellipse cx="200" cy="260" rx="110" ry="16" fill="#000000" opacity="0.45" filter="url(#shadow7)" />

  <!-- Tropical Cut Pink Guava on Left -->
  <g transform="translate(110, 185)">
    <!-- Outer Green Skin -->
    <ellipse cx="28" cy="28" rx="26" ry="24" fill="#65a30d" />
    <ellipse cx="28" cy="28" rx="24" ry="22" fill="#84cc16" />
    <!-- White Pith Layer -->
    <ellipse cx="28" cy="28" rx="21" ry="19" fill="#fef08a" />
    <!-- Rich Pink Flesh -->
    <ellipse cx="28" cy="28" rx="19" ry="17" fill="#f43f5e" />
    <ellipse cx="28" cy="28" rx="16" ry="14" fill="#fb7185" />
    <!-- Guava Core Seeds -->
    <circle cx="24" cy="24" r="1.3" fill="#fef08a" />
    <circle cx="28" cy="22" r="1.3" fill="#fef08a" />
    <circle cx="32" cy="25" r="1.3" fill="#fef08a" />
    <circle cx="26" cy="31" r="1.3" fill="#fef08a" />
    <circle cx="30" cy="30" r="1.3" fill="#fef08a" />

    <!-- Guava Leaf -->
    <path d="M 6 12 Q -10 0 -12 18 Q 0 18 6 12 Z" fill="#15803d" />
  </g>

  <!-- 250ML SLIM GUAVA NECTAR CARTON -->
  <g filter="url(#shadow7)">
    <rect x="172" y="70" width="56" height="175" rx="5" fill="url(#guavaCarton)" />

    <!-- Carton Top Gable -->
    <path d="M 172 70 L 180 54 L 220 54 L 228 70 Z" fill="#db2777" />
    <rect x="194" y="44" width="12" height="12" rx="3" fill="#ffffff" />
    <circle cx="200" cy="50" r="3.5" fill="#f43f5e" />

    <path d="M 176 72 L 176 240 Q 176 243 174 243 L 173 243 Q 173 240 173 72 Z" fill="#ffffff" opacity="0.6" />

    <!-- Front Label Artwork -->
    <rect x="174" y="90" width="52" height="135" rx="3" fill="#ffffff" fill-opacity="0.12" />

    <!-- Brand Header -->
    <rect x="176" y="94" width="48" height="18" rx="3" fill="#701a75" />
    <text x="200" y="104" font-family="Arial, sans-serif" font-size="5" font-weight="900" fill="#fbcfe8" text-anchor="middle" letter-spacing="0.5">AL-FAROOQ</text>
    <text x="200" y="110" font-family="Arial, sans-serif" font-size="3.5" font-weight="700" fill="#ffffff" text-anchor="middle">TROPICAL NECTAR</text>

    <!-- Pink Guava Emblem -->
    <circle cx="200" cy="146" r="16" fill="#84cc16" />
    <circle cx="200" cy="146" r="13" fill="#f43f5e" />
    <circle cx="200" cy="146" r="10" fill="#fb7185" />

    <text x="200" y="178" font-family="Arial, sans-serif" font-size="5.5" font-weight="900" fill="#ffffff" text-anchor="middle">PINK GUAVA</text>
    <text x="200" y="186" font-family="Arial, sans-serif" font-size="4.5" font-weight="800" fill="#fbcfe8" text-anchor="middle">FRUIT NECTAR</text>

    <rect x="182" y="193" width="36" height="8" rx="2" fill="#84cc16" />
    <text x="200" y="199" font-family="Arial, sans-serif" font-size="4" font-weight="800" fill="#14532d" text-anchor="middle">250 ML PACK</text>
    <text x="200" y="210" font-family="Arial, sans-serif" font-size="3" fill="#ffffff" opacity="0.9" font-weight="700" text-anchor="middle">VITAMIN C ENRICHED</text>
  </g>

  <!-- Droplets -->
  <circle cx="242" cy="125" r="2.5" fill="#fbcfe8" opacity="0.8" />
  <circle cx="248" cy="150" r="2" fill="#f43f5e" opacity="0.8" />
  <circle cx="236" cy="170" r="3" fill="#fb7185" opacity="0.9" />

  <!-- Packaging Badge -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="112" height="26" rx="13" fill="#0a0f1d" fill-opacity="0.85" stroke="#f472b6" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#ec4899" />
    <text x="26" y="17" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">24-PACK CARTON</text>
  </g>

  <!-- Watermark -->
  <g transform="translate(16, 252)">
    <rect x="0" y="0" width="156" height="28" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="10" y="13" font-family="Arial, sans-serif" font-size="8.5" font-weight="900" fill="#f472b6">AL-FAROOQ FOODS</text>
    <text x="10" y="23" font-family="Arial, sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8">Guava Fruit Nectar 250ml</text>
  </g>
</svg>
