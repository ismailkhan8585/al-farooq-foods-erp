<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bottle6L" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.65" />
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#7dd3fc" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="waterLiquid3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.65" />
    </linearGradient>

    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad3)" />
  <circle cx="200" cy="145" r="140" fill="url(#glow3)" />
  <ellipse cx="200" cy="265" rx="110" ry="16" fill="#000000" opacity="0.45" filter="url(#shadow3)" />

  <!-- MAIN 6L JUG WITH HANDLE -->
  <g filter="url(#shadow3)">
    <!-- Main Sturdy Ribbed Jug Body -->
    <path d="M 185 65 
             Q 185 90 152 115 
             L 152 240 
             Q 152 255 168 255 
             L 232 255 
             Q 248 255 248 240 
             L 248 115 
             Q 215 90 215 65 Z" 
          fill="url(#waterLiquid3)" />

    <path d="M 185 65 
             Q 185 90 152 115 
             L 152 240 
             Q 152 255 168 255 
             L 232 255 
             Q 248 255 248 240 
             L 248 115 
             Q 215 90 215 65 Z" 
          fill="url(#bottle6L)" />

    <!-- Molded Ergonomic Handle on Right Side -->
    <path d="M 235 125 
             Q 265 140 265 175 
             Q 265 210 235 225 
             L 230 210 
             Q 250 198 250 175 
             Q 250 152 230 140 Z" 
          fill="#38bdf8" opacity="0.85" />
    <path d="M 235 125 Q 265 140 265 175 Q 265 210 235 225" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />

    <!-- Horizontal Stiffening Ribs -->
    <line x1="156" y1="135" x2="228" y2="135" stroke="#bae6fd" stroke-width="2" opacity="0.6" />
    <line x1="156" y1="170" x2="228" y2="170" stroke="#bae6fd" stroke-width="2" opacity="0.6" />
    <line x1="156" y1="205" x2="228" y2="205" stroke="#bae6fd" stroke-width="2" opacity="0.6" />

    <!-- Label -->
    <rect x="162" y="142" width="64" height="52" rx="4" fill="#047857" />
    <rect x="164" y="144" width="60" height="48" rx="3" fill="none" stroke="#34d399" stroke-width="1" />
    <text x="194" y="157" font-family="Arial, sans-serif" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle">AL-FAROOQ</text>
    <text x="194" y="167" font-family="Arial, sans-serif" font-size="4" font-weight="700" fill="#a7f3d0" text-anchor="middle">MINERAL WATER</text>
    <rect x="174" y="172" width="40" height="10" rx="3" fill="#065f46" />
    <text x="194" y="179" font-family="Arial, sans-serif" font-size="4.5" font-weight="800" fill="#facc15" text-anchor="middle">6L FAMILY PACK</text>
    <text x="194" y="188" font-family="Arial, sans-serif" font-size="3" fill="#ffffff" opacity="0.85" text-anchor="middle">ERGONOMIC HANDLE</text>

    <!-- Broad Neck & Cap -->
    <rect x="184" y="62" width="32" height="5" rx="2" fill="#e0f2fe" opacity="0.9" />
    <rect x="186" y="44" width="28" height="20" rx="4" fill="#059669" />
    <line x1="192" y1="46" x2="192" y2="62" stroke="#064e3b" stroke-width="1" />
    <line x1="197" y1="46" x2="197" y2="62" stroke="#064e3b" stroke-width="1" />
    <line x1="201" y1="46" x2="201" y2="62" stroke="#6ee7b7" stroke-width="1" />
    <line x1="205" y1="46" x2="205" y2="62" stroke="#064e3b" stroke-width="1" />
    <line x1="209" y1="46" x2="209" y2="62" stroke="#064e3b" stroke-width="1" />
  </g>

  <!-- Packaging Badge -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="124" height="26" rx="13" fill="#0a0f1d" fill-opacity="0.85" stroke="#34d399" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#10b981" />
    <text x="26" y="17" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">6L FAMILY JUG</text>
  </g>

  <g transform="translate(16, 252)">
    <rect x="0" y="0" width="144" height="28" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="10" y="13" font-family="Arial, sans-serif" font-size="8.5" font-weight="900" fill="#34d399">AL-FAROOQ FOODS</text>
    <text x="10" y="23" font-family="Arial, sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8">Mineral Water 6L Family Bottle</text>
  </g>
</svg>
